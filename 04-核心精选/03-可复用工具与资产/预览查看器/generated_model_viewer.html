<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 风格角色 3D 预览</title>
<script type="module"
  src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2328;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 24px 0 4px; }
  p.sub { margin: 0 0 16px; color: #57606a; font-size: 13px; }
  model-viewer {
    width: min(92vw, 780px);
    height: min(70vh, 640px);
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .tips { margin: 14px 0 24px; font-size: 13px; color: #57606a; }
</style>
</head>
<body>
  <h1>Minecraft 风格角色 · 图生 3D 模型</h1>
  <p class="sub">由单张正面参考图生成（标准带贴图模式）</p>
  <model-viewer src="../03-Minecraft-角色/minecraft_character.glb" alt="3D model"
    camera-controls auto-rotate shadow-intensity="1"
    exposure="1" environment-image="neutral">
  </model-viewer>
  <div class="tips">鼠标左键拖动旋转 · 滚轮缩放 · 右键平移</div>
</body>
</html>
